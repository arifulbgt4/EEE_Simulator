schema_version: "1.0.0"
registry_id: "eesim-package-registry"
title: "Reusable physical package and appearance registry"
scope: "Physical/package metadata is independent of electrical component family and variant counts."
source_evidence_policy: "../SOURCE_AND_EVIDENCE_POLICY.md"
source_citation_rule: "Generic geometry is illustrative planning data; dimensional, manufacturer, standards, safety, license, and manufacturability claims require applicable reviewed primary and current project evidence."
normative_units: "SI base units; all dimensions below are metres"
package_count: 38
requirements: ["REQ-037", "REQ-038"]
binding_contract:
  document: "DEVICE_PACKAGE_BINDING_CONTRACT.md"
  candidate_fields: ["component family package_compatibility", "component variant package_refs"]
  candidate_release_authority: "none; candidate references are never package selections, pin maps, or release evidence"
  concrete_binding: "A versioned DevicePackageBinding resolves one exact package revision and parameter set, logical pin contract, contact map, appearance revision, provenance, and validation evidence."
identity_rules:
  view_switch_preserves: ["instance_id", "connectivity", "parameters", "model_binding", "simulation_state", "selection", "undo_history"]
  electrical_package_separation: true
  footprint_metadata_optional: true
  explicit_pin_map_required: true
  candidate_reference_is_binding: false
  physical_accuracy_claim: "illustrative unless dimensions and source are verified"
designer_contract:
  id: "package-designer-v1"
  supports: ["body shape", "body dimensions", "lead form", "lead rows", "pitch", "pin count", "pin numbering", "pin names", "excluded pins", "thermal pads", "value, rating, and applicable safety markings", "materials and colors", "orientation", "custom pin map", "package-specific limits"]
  validation: ["finite positive dimensions", "integer pin count in package range", "no duplicate or out-of-range package pins", "no missing or unmapped required logical pins", "all required logical pins mapped exactly once", "explicit NC and exposed pads", "visible pin-one or polarity cue", "collision-free lead placement", "creepage and footprint claims remain unverified unless separately sourced"]
  output: "immutable PackageDefinition revision; it may remain unbound and does not become a device package until a separate DevicePackageBinding is validated"
marking_policy:
  required_when_applicable: ["polarity", "pin one or A1", "value or device code", "voltage, current, temperature, and safety rating"]
  protected_marks: "Do not reproduce vendor logos, certification marks, or trade dress without documented permission."
  accessibility: "Every visual marking has a text equivalent and no meaning depends on color alone."
golden_reference_policy:
  cat: "Use only the package entry's primary_golden_fixture."
  sym_validation_docs: "Use the primary_golden_fixture plus GRC-054 for dual-view identity/state preservation; de-duplicate when the primary fixture is GRC-054."
packages:
  - id: "pkg-virtual"
    revision: "1.0.0"
    primary_golden_fixture: "GRC-054"
    name: "Virtual or schematic-only"
    classification: "virtual"
    mounting: "none"
    lead_form: "none"
    lifecycle: "Template"
    pin_count:
      default: 0
      minimum: 0
      maximum: 4096
      rule: "parameterized count; selected count is immutable within a package revision"
    dimensions:
      body_length_m: 0
      body_width_m: 0
      body_height_m: 0
      pitch_m: 0
      tolerance_policy: "nominal generic template; manufacturer tolerances require sourced overrides"
    appearance:
      body_shape: "symbol-space"
      representation: "original scalable vector or procedural geometry"
      required_details: ["body", "contacts or leads", "polarity or pin-one cue", "value or part marking area", "material regions"]
      lod_levels: ["silhouette", "orientation-and-pins", "markings-and-material-detail"]
      orientation_marking: "none"
      non_color_cues: true
    markings:
      fields: ["reference designator", "value or device code", "polarity or pin-one", "optional user label"]
      text_policy: "scalable, legible, non-overlapping, user-editable; do not reproduce protected vendor marks"
    materials:
      body: "generic polymer, ceramic, metal, glass, board, or profile-specific material"
      contacts: "generic plated copper alloy unless a sourced override is attached"
      lens_or_window: "profile-specific and optional"
      color_policy: "realistic defaults are hints; meaning is never color-only"
    orientation:
      origin: "package body center unless a sourced footprint defines another origin"
      zero_rotation: "pin one or positive terminal at the documented canonical corner/end"
      rotation_step_deg: 90
      mirror_policy: "mirror changes view only; electrical pin map remains stable"
    pin_mapping:
      logical_to_package: "explicit map stored on the component instance or reusable device-package binding"
      required_checks: ["unique physical pin", "logical-pin existence", "power and ground labels retained", "NC pins explicit", "thermal pad explicit", "orientation round-trip"]
    footprint_relation:
      footprint_id: null
      authority: "optional metadata; visual package is not a manufacturable footprint by itself"
    provenance:
      geometry_source: "project-authored generic dimensional template"
