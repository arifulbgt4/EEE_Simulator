count_rule: "Counts describe only the nine planning records in this file. Component families, component variants, packages, symbols, bindings, and benchmark fixtures are separate inventories."
publication_rule: "A planned entry is not executable or published. Release requires a non-null content digest, reviewed provenance and license, validated units and equations, independent evidence, a bounded validity envelope, and the applicable release gate."
revision_rule: "The stable id names a model lineage. revision_id is immutable and equals <id>@<semantic-revision>. A changed equation, parameter meaning, dependency revision, unit, state, numerical method, or validity claim creates a new revision."
