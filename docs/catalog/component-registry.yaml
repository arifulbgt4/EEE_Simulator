schema_version: "1.1.0"
registry_id: "eesim-component-registry"
pin_profile_registry: "variant-pin-profiles.yaml"
title: "EEE Simulation canonical component registry"
status: "Frozen documentation baseline"
baseline:
  production_families: 157
  production_variants: 494
  mvp_variants: 106
  post_mvp_variants: 388
  deferred_families: 5
  deferred_variants: 8
  total_families: 162
  total_variants: 502
  pin_profiles: 502
  package_dimension: "separate; package entries do not change component counts"
identifier_policy:
  family: "fam-<category>-<family>"
  variant: "var-<category>-<family>-<variant>"
  pin_profile: "pinprof-<category>-<family>-<variant>"
  stability: "IDs are immutable after publication"
variant_policy:
  pin_profile: "Every variant resolves exactly one normative entry in variant-pin-profiles.yaml before ERC, netlisting, model binding, package binding, persistence, or execution"
  basic_tag: "class_tags contains basic-component"
  release_target: "Every production variant names a release gate; research variants name Research"
  mvp_profile: "Exactly 106 curated presets required by the core connectivity, source, RLC, switch, diode/LED, BJT, MOSFET, op-amp, basic-logic, and instrument acceptance profile; all other production presets remain tracked for the R7 complete-catalog gate"
  basic_release_rule: "A basic-component variant cannot be Released without original scalable physical artwork and a validated explicit package pin map"
  package_count_rule: "Packages are an independent dimension and never change the 162-family/502-variant component baseline"
categories:
  - id: "cat-connectivity"
    name: "Connectivity and schematic primitives"
    status: "Production baseline"
    source: "Source PDF, pp. 6-8"
