              package_map_required: true
            model_tiers: ["F0", "F1"]
            package_refs: ["pkg-virtual"]
        supported_analyses: ["connectivity", "erc"]
        model_tiers: ["F0", "F1"]
        behavior:
          temperature: "reference temperature and family-specific coefficients are explicit; F4 requires self-heating where applicable"
          parasitics: "disabled only at ideal fidelity; resistance, capacitance, inductance, leakage, and delay are declared when applicable"
          failures: ["open-circuit", "short-circuit", "parameter-drift", "overstress-or-saturation"]
        import_mappings: ["SPICE .model/.subckt", "Verilog-A/AMS 2023", "CSV/PWL"]
        provenance:
