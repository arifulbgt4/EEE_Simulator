schema_version: "1.0.0"
registry_id: "eesim-component-registry"
title: "EEE Simulation canonical component registry"
status: "Frozen documentation baseline"
baseline:
  production_families: 157
  production_variants: 494
  deferred_families: 5
  deferred_variants: 8
  total_families: 162
  total_variants: 502
  package_dimension: "separate; package entries do not change component counts"
identifier_policy:
  family: "fam-<category>-<family>"
  variant: "var-<category>-<family>-<variant>"
  stability: "IDs are immutable after publication"
variant_policy:
  basic_tag: "class_tags contains basic-component"
  release_target: "Every production variant names a release gate; research variants name Research"
  basic_release_rule: "A basic-component variant cannot be Released without original scalable physical artwork and a validated explicit package pin map"
  package_count_rule: "Packages are an independent dimension and never change the 162-family/502-variant component baseline"
categories:
