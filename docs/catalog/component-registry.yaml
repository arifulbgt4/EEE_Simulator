        symbol:
          id: "sym-connectivity-wire"
          artwork: "original project artwork; IEC/ANSI-aligned, never copied from IEC 60617"
          views: ["schematic", "physical", "package"]
          orientation_rule: "pin-1 or polarity marker remains visible at every rotation"
        pins:
          - { id: "1", name: "P", electrical_type: "passive", domains: ["electrical", "schematic"] }
          - { id: "2", name: "N", electrical_type: "passive", domains: ["electrical", "schematic"] }
        domains: ["electrical", "schematic"]
        parameters:
          - { id: "nominal", name: "Family-specific nominal value", unit: "SI", default: "1", limits: "variant-defined" }
          - { id: "temperature", name: "Reference temperature", unit: "K", default: "300.15", limits: "1..1000" }
